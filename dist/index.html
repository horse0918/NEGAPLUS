<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11121a"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css"><title>NEGA+</title><script type="module" src="./app.js"></script></head><body><main><header><h1>NEGA<span>+</span></h1><p>Slang / Street Talk / Gen Z</p></header><section aria-label="單字卡"><div class="card"><div class="meta"><span id="tag"></span><span id="count"></span></div><h2 id="word">載入單字庫…</h2><div id="answer" hidden><p id="meaning"></p><p id="example"></p></div><button id="flip" class="accent" aria-expanded="false" aria-controls="answer">翻開卡片</button></div><nav aria-label="切換單字卡"><button id="prev">上一張</button><button id="shuffle">洗牌</button><button id="next">下一張</button></nav></section><section class="settings"><h2>休息提醒</h2><form id="reminders"><div class="fields"><label>開始時間<input name="start" type="time" value="09:00" required></label><label>結束時間<input name="end" type="time" value="17:00" required></label><label>間隔（分鐘）<input name="interval" type="number" min="1" max="1440" value="60" required></label></div><nav><button class="accent">啟用並儲存</button><button type="button" id="test">試推一個字</button><button type="button" id="stop">關閉提醒</button></nav></form><p id="status" role="status"></p></section><footer>iPhone 安裝方式：Safari「分享」→「加入主畫面」。</footer></main></body></html>
